name: Snappy
options:
  bundleIdPrefix: com.katsuma
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Snappy:
    type: application
    platform: macOS
    sources:
      - path: Snappy
    info:
      path: Snappy/Resources/Info.plist
      properties:
        CFBundleDisplayName: Snappy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSAccessibilityUsageDescription: "Snappy needs accessibility access to move and resize windows."
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
    entitlements:
      path: Snappy/Resources/Snappy.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.katsuma.Snappy
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
